<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma - Premium Color Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        
        <div class="left-panel">
            <h2 class="section-title" style="display: flex; justify-content: space-between; align-items: baseline;">
                Image
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Tip: Hold SHIFT to slow down movement</span>
            </h2>
            <div class="image-workspace">
                <!-- Overlay message when empty -->
                <div id="drop-zone" class="drop-zone">
                    <p>Drag & Drop an image here or use the panel to upload</p>
                </div>
                <!-- Canvas for image drawing and pixel picking -->
                <canvas id="image-canvas"></canvas>
                <!-- Magnifier lens -->
                <div id="magnifier" class="magnifier">
                    <canvas id="magnifier-canvas" width="100" height="100"></canvas>
                    <div class="crosshair"></div>
                </div>
            </div>

            <div class="palette-section">
                <h2 class="section-title">Color Palette</h2>
                <div class="palette-toolbar">
                    <div class="palette-actions-left">
                        <button id="btn-remove-color" class="icon-btn" title="Remove last color">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
                        </button>
                        <button id="btn-add-color" class="icon-btn" title="Add current color">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                    </div>
                    
                    <div id="color-palette" class="color-palette">
                        <!-- Colors will be appended here -->
                    </div>

                    <div class="palette-actions-right">
                        <button id="btn-download" class="icon-btn" title="Download Palette">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        </button>
                        <button id="btn-save" class="icon-btn" title="Save Palette">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                <h2 class="section-title" style="margin-bottom: 0;">Colors</h2>
                <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode" style="width: 32px; height: 32px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
            
            <div class="color-swatches">
                <div id="primary-swatch" class="swatch" style="background-color: #2596be;"></div>
                <div id="secondary-swatch" class="swatch secondary" style="background-color: #eebf88;"></div>
            </div>

            <div class="color-values">
                <div class="value-row">
                    <span class="label">HEX</span>
                    <input type="text" id="hex-input" value="#2596be" readonly>
                    <button class="copy-btn" data-target="hex-input" title="Copy HEX">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <div class="value-row">
                    <span class="label">RGB</span>
                    <input type="text" id="rgb-input" value="rgb(37, 150, 190)" readonly>
                    <button class="copy-btn" data-target="rgb-input" title="Copy RGB">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <div class="value-row">
                    <span class="label">HSL</span>
                    <input type="text" id="hsl-input" value="hsl(196, 67%, 45%)" readonly>
                    <button class="copy-btn" data-target="hsl-input" title="Copy HSL">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            </div>



            <div class="upload-section">
                <h3 class="subsection-title">Use your own image</h3>
                <div class="upload-card">
                    <label for="image-upload" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Use your image
                    </label>
                    <input type="file" id="image-upload" accept="image/*" hidden>
                    
                    <button id="btn-screen-pick" class="secondary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                        Pick from Screen
                    </button>
                </div>
                
                <div class="privacy-note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <p>We think data protection is important! <strong>No data is sent.</strong> The magic happens in your browser.</p>
                </div>
            </div>
        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>

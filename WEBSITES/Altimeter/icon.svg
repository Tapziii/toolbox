<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Mountain graphic -->
  <path d="M120 380 L256 160 L392 380 Z" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M256 160 L392 380 L120 380 Z" fill="url(#accent)" opacity="0.2"/>
  <path d="M200 380 L290 240 L380 380 Z" fill="none" stroke="#60a5fa" stroke-width="16" stroke-linejoin="round"/>
</svg>

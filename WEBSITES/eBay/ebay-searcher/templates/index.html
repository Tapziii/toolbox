<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search eBay for the best deals — filter by price, condition, location, and more.">
    <title>eBay Deal Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ═══════════════════ HEADER ═══════════════════ -->
    <header class="top-bar">
        <div class="top-bar__brand">
            <svg class="top-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <h1 class="top-bar__title">Deal<span>Finder</span></h1>
        </div>
        <div class="top-bar__stats" id="resultStats"></div>
    </header>

    <!-- ═══════════════════ SEARCH HERO ═══════════════════ -->
    <section class="hero" id="heroSection">
        <div class="hero__inner">
            <h2 class="hero__heading">Find the best deals on eBay</h2>
            <p class="hero__sub">Search millions of listings — filter by price, condition, location, and more.</p>
            <!-- ── Presets Bar ── -->
            <div class="presets-bar" style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto;">
                <select id="presetDropdown" class="filter-input" style="flex: 1; padding: 0.8rem 1rem; border-radius: var(--radius-md);">
                    <option value="">-- Load a Saved Preset --</option>
                </select>
                <button id="savePresetBtn" class="search-bar__btn" style="padding: 0.8rem 1.2rem; font-size: 0.9rem;">Save Preset</button>
                <button id="deletePresetBtn" class="search-bar__btn" style="padding: 0.8rem 1.2rem; font-size: 0.9rem; background: rgba(239, 68, 68, 0.8); display: none;">Delete</button>
            </div>
            <form class="search-bar" id="searchForm" autocomplete="off">
                <div class="search-bar__input-wrap">
                    <svg class="search-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-bar__input" placeholder="Search for anything…" required>
                    <button type="submit" class="search-bar__btn" id="searchBtn">Search</button>
                </div>
            </form>

            <!-- ── Filters Panel ── -->
            <div class="filters-panel" id="filtersRow">
                
                <!-- Row 1 -->
                <div class="filter-group">
                    <label class="filter-label">Min Price</label>
                    <div class="filter-input-wrap">
                        <span class="filter-currency" id="currencySymbol">$</span>
                        <input type="number" id="minPrice" class="filter-input" placeholder="0" min="0" step="1">
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Price</label>
                    <div class="filter-input-wrap">
                        <span class="filter-currency" id="currencySymbol2">$</span>
                        <input type="number" id="maxPrice" class="filter-input" placeholder="Any" min="0" step="1">
                    </div>
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 0.3rem; margin-top: 0.25rem; cursor: pointer;">
                        <input type="checkbox" id="includeShipping" style="cursor: pointer; margin: 0;">
                        <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 500;">Include Shipping</span>
                    </label>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Category</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">All Categories</option>
                        <option value="625">Cameras & Photo (All)</option>
                        <option value="31388">Digital Cameras</option>
                        <option value="3323">Lenses</option>
                        <option value="15216">Filters</option>
                        <option value="162046">Batteries</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Condition</label>
                    <select id="conditionFilter" class="filter-select">
                        <option value="all">All Conditions</option>
                        <option value="new">New</option>
                        <option value="openBox">Open Box</option>
                        <option value="refurbished">Refurbished</option>
                        <option value="used">Used</option>
                        <option value="parts">For Parts</option>
                    </select>
                </div>

                <!-- Row 2 -->
                <div class="filter-group">
                    <label class="filter-label">Format</label>
                    <select id="formatFilter" class="filter-select">
                        <option value="all">All Listings</option>
                        <option value="bin">Buy It Now (No Bids)</option>
                        <option value="auction">Auction (Bids Only)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Sort By</label>
                    <select id="sortFilter" class="filter-select">
                        <option value="bestMatch">Best Match</option>
                        <option value="newlyListed">Newly Listed</option>
                        <option value="endingSoonest">Ending Soonest</option>
                        <option value="priceLow">Lowest Price</option>
                        <option value="priceHigh">Highest Price</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Marketplace</label>
                    <select id="marketplaceFilter" class="filter-select">
                        <option value="EBAY_US">eBay US (USD)</option>
                        <option value="EBAY_GB">eBay UK (GBP)</option>
                        <option value="EBAY_DE">eBay DE (EUR)</option>
                        <option value="EBAY_FR">eBay FR (EUR)</option>
                        <option value="EBAY_IT">eBay IT (EUR)</option>
                        <option value="EBAY_ES">eBay ES (EUR)</option>
                        <option value="EBAY_AU">eBay AU (AUD)</option>
                        <option value="EBAY_CA">eBay CA (CAD)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Display Currency</label>
                    <select id="displayCurrency" class="filter-select">
                        <option value="original">Original</option>
                        <option value="USD">$ USD</option>
                        <option value="EUR">€ EUR</option>
                        <option value="ILS">₪ ILS</option>
                        <option value="GBP">£ GBP</option>
                    </select>
                </div>

                <!-- Row 3 (Spanning) -->
                <div class="filter-group filter-group--span2">
                    <label class="filter-label">Exclude Keywords</label>
                    <div class="filter-input-wrap">
                        <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        <input type="text" id="excludeKwInput" class="filter-input" placeholder="Type and press Enter…">
                    </div>
                    <div class="tag-list" id="excludeKwList"></div>
                </div>
                <div class="filter-group filter-group--span2">
                    <label class="filter-label">Exclude Countries</label>
                    <div class="filter-input-wrap">
                        <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                        <input type="text" id="excludeCtryInput" class="filter-input" placeholder="Type country and press Enter…" list="countryList">
                    </div>
                    <div class="tag-list" id="excludeCtryList"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ═══════════════════ RESULTS ═══════════════════ -->
    <main class="results-container">
        <div class="loader" id="loader">
            <div class="loader__ring"></div>
            <p class="loader__text">Searching eBay…</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="empty-state" id="emptyState">
            <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <p>Start by typing a search above</p>
        </div>
        <div class="no-results" id="noResults" style="display:none">
            <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>No results found — try different keywords or filters</p>
        </div>
        <div class="product-grid" id="productGrid"></div>
        
        <!-- ── Pagination ── -->
        <div class="pagination" id="paginationControls" style="display: none; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem; padding-bottom: 2rem;">
            <button id="prevPageBtn" class="search-bar__btn" style="padding: 0.5rem 1rem;">&larr; Previous</button>
            <span id="pageIndicator" style="font-weight: 600; color: var(--text-primary);">Page 1</span>
            <button id="nextPageBtn" class="search-bar__btn" style="padding: 0.5rem 1rem;">Next &rarr;</button>
        </div>
    </main>

    <datalist id="countryList">
        <option value="China">
        <option value="Hong Kong">
        <option value="United States">
        <option value="United Kingdom">
        <option value="Canada">
        <option value="Australia">
        <option value="Germany">
        <option value="Japan">
        <option value="France">
        <option value="Italy">
        <option value="Spain">
    </datalist>

    <script src="/static/app.js"></script>
</body>
</html>
